<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Senior Dev Coach</title>
<desc id="d">Isometric cubes rising in steps under a green spotlight. Evaluate. Learn. Ship better.</desc>
<defs>
<radialGradient id="bg" cx="75%" cy="30%" r="90%"><stop offset="0" stop-color="#14224a"/><stop offset=".55" stop-color="#090e1f"/><stop offset="1" stop-color="#03050b"/></radialGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
<linearGradient id="lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4fb8"/><stop offset="1" stop-color="#13214f"/></linearGradient>
<linearGradient id="rt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3380"/><stop offset="1" stop-color="#0a1230"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#8fb4ff"/></linearGradient>
<linearGradient id="spot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb0ff" stop-opacity=".38"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#5b7bd0" fill-opacity=".28"/></pattern>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
<g id="cube"><polygon points="40,0 80,20 40,40 0,20" fill="url(#top)"/><polygon points="0,20 40,40 40,100 0,80" fill="url(#lf)"/><polygon points="40,40 80,20 80,80 40,100" fill="url(#rt)"/><polyline points="0,20 40,40 80,20" fill="none" stroke="#bfe5ff" stroke-opacity=".6"/></g>
</defs>
<style>
.t{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rise{animation:rs 5s ease-in-out infinite}.r2{animation-delay:.2s}.r3{animation-delay:.4s}.r4{animation-delay:.6s}.r5{animation-delay:.8s}.r6{animation-delay:1s}
@keyframes rs{0%{transform:translateY(40px);opacity:0}25%,85%{transform:none;opacity:1}100%{transform:translateY(40px);opacity:0}}
.spin{animation:sp 28s linear infinite;transform-origin:905px 165px}.spin2{animation-direction:reverse;animation-duration:40s}@keyframes sp{to{transform:rotate(360deg)}}
.march{animation:mr 6s linear infinite}@keyframes mr{to{stroke-dashoffset:-48}}
.beam{animation:bm 6s ease-in-out infinite}@keyframes bm{50%{opacity:.4}}
.cur{animation:cu 1s steps(1) infinite}@keyframes cu{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="320" fill="url(#bg)"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<polygon class="beam" points="865,0 945,0 1165,320 645,320" fill="url(#spot)"/>
<ellipse cx="905" cy="290" rx="200" ry="14" fill="#000" opacity=".7" filter="url(#blur)"/>
<ellipse class="spin spin2" cx="905" cy="165" rx="215" ry="146" fill="none" stroke="#8f7bff" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="2 10" stroke-linecap="round"/>
<g transform="rotate(-18 905 165)"><ellipse class="march" cx="905" cy="165" rx="250" ry="66" fill="none" stroke="#6fd0ff" stroke-opacity=".5" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round"/></g>
<g transform="translate(794 238.5) scale(.42)">
<g transform="translate(0 0)"><g class="rise r1"><use href="#cube" y="0"/></g></g>
<g transform="translate(90 -30)"><g class="rise r2"><use href="#cube" y="0"/><use href="#cube" y="-60"/></g></g>
<g transform="translate(180 -60)"><g class="rise r3"><use href="#cube" y="0"/><use href="#cube" y="-60"/><use href="#cube" y="-120"/></g></g>
<g transform="translate(270 -90)"><g class="rise r4"><use href="#cube" y="0"/><use href="#cube" y="-60"/><use href="#cube" y="-120"/><use href="#cube" y="-180"/></g></g>
<g transform="translate(360 -120)"><g class="rise r5"><use href="#cube" y="0"/><use href="#cube" y="-60"/><use href="#cube" y="-120"/><use href="#cube" y="-180"/><use href="#cube" y="-240"/></g></g>
<g transform="translate(450 -150)"><g class="rise r6"><use href="#cube" y="0"/><use href="#cube" y="-60"/><use href="#cube" y="-120"/><use href="#cube" y="-180"/><use href="#cube" y="-240"/><use href="#cube" y="-300"/></g></g>
</g>
<g transform="rotate(-18 905 165)"><path class="march" d="M655 165 A250 66 0 0 0 1155 165" fill="none" stroke="#6fd0ff" stroke-opacity=".9" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/></g>
<text class="t" x="70" y="150" font-size="68" font-weight="700" fill="url(#tx)" letter-spacing="-1.5">Senior Dev Coach</text>
<text class="t" x="72" y="196" font-size="22" fill="#8fa3c7">Evaluate. Learn. Ship better.</text>
<text class="m" x="72" y="244" font-size="16" fill="#3dffb0">$ senior-coach evaluate<tspan class="cur"> ▌</tspan></text>
</svg>
