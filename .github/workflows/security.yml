name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The guard that judges a pull request always comes from the trusted base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: head, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with: { path: base, ref: "${{ github.event.pull_request.base.sha }}", persist-credentials: false }
      - name: Scan (never executes scanned code)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            if [ -f base/.github/scripts/guard.py ]; then
              python3 -I base/.github/scripts/guard.py --repo head --base "$BASE_SHA" --allowlist base/.github/guard-allowlist.json
            else
              # First PR that adds guard: base has no copy yet.
              python3 -I head/.github/scripts/guard.py --repo head --base "$BASE_SHA" --allowlist head/.github/guard-allowlist.json
            fi
          else
            python3 -I head/.github/scripts/guard.py --repo head --allowlist head/.github/guard-allowlist.json
          fi
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: moderate, comment-summary-in-pr: never }
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with: { category: "/language:${{ matrix.language }}" }
